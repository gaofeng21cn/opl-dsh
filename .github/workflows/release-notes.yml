name: Normalize release notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-notes.yml'
      - 'scripts/normalize-release-notes.mjs'
      - 'scripts/release-notes.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opl-dsh-stable-release
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove only the duplicate heading from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/normalize-release-notes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-notes-audit
          path: dist/release-notes-audit/
          if-no-files-found: warn
