name: SuperAgent prototype
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vendor/dsh-superagent/**'
      - 'scripts/build-superagent.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/superagent.yml'
  pull_request:
    paths:
      - 'vendor/dsh-superagent/**'
      - 'scripts/build-superagent.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/superagent.yml'
permissions:
  contents: read
jobs:
  superagent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck --workspace dsh-superagent
      - run: npm run test:superagent
