name: Stable release
run-name: >-
  ${{ inputs.opl_release_control_run_id != ''
    && format('Stable release [opl-release:{0}]', inputs.opl_release_control_run_id)
    || 'Stable release' }}

on:
  schedule:
    - cron: '37 18 * * *'
  push:
    tags: ['opl-dsh-v*']
  workflow_dispatch:
    inputs:
      cask_only:
        description: Sync Homebrew from the verified public Latest release
        type: boolean
        default: false
      rebuild:
        description: Rebuild and requalify a frozen candidate without reusing prior Actions artifacts
        type: boolean
        default: false
      opl_release_control_run_id:
        description: Schedule run ID from the OPL release controller
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'schedule' && vars.OPL_RELEASE_CENTRAL_DAILY == 'true'
      && 'opl-dsh-disabled-schedule' || 'opl-dsh-stable-release' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name != 'schedule' || vars.OPL_RELEASE_CENTRAL_DAILY != 'true') &&
      (!inputs.cask_only || inputs.opl_release_control_run_id != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      copilot-requests: write
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate-version.outputs.version }}
      source_commit: ${{ steps.candidate.outputs.source_commit }}
      official_version: ${{ steps.candidate.outputs.official_version }}
      official_windows_version: ${{ steps.candidate.outputs.official_windows_version }}
      official_feeds_sha256: ${{ steps.candidate.outputs.official_feeds_sha256 }}
      package_key: ${{ steps.candidate.outputs.package_key }}
      qualification_key: ${{ steps.candidate.outputs.qualification_key }}
      package_artifact: ${{ steps.candidate.outputs.package_artifact }}
      package_run: ${{ steps.candidate.outputs.package_run }}
      mac_artifact: ${{ steps.candidate.outputs.mac_artifact }}
      mac_run: ${{ steps.candidate.outputs.mac_run }}
      windows_artifact: ${{ steps.candidate.outputs.windows_artifact }}
      windows_run: ${{ steps.candidate.outputs.windows_run }}
      pending_platforms: ${{ steps.candidate.outputs.pending_platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject recovery inputs on central schedule
        if: inputs.opl_release_control_run_id != ''
        env:
          CASK_ONLY: ${{ inputs.cask_only }}
          REBUILD: ${{ inputs.rebuild }}
        shell: bash
        run: test "$CASK_ONLY" = false && test "$REBUILD" = false || { echo "::error::Central schedules require no recovery inputs."; exit 1; }
      - name: Verify central schedule invocation
        if: inputs.opl_release_control_run_id != ''
        uses: gaofeng21cn/opl-release/.github/actions/verify-dispatch@v1
        with:
          control_run_id: ${{ inputs.opl_release_control_run_id }}
          workflow: stable-release.yml
          expected_title: ${{ format('Stable release [opl-release:{0}]', inputs.opl_release_control_run_id) }}
          gh_token: ${{ github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Load shared release-note writer policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-shared-release-note-writer.mjs
      - name: Detect enhancement or official desktop updates, or resume a frozen tag
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          OPL_RELEASE_REBUILD: ${{ inputs.rebuild }}
          OPL_RELEASE_NOTES_CODEX_API_KEY: ${{ secrets.OPL_RELEASE_NOTES_CODEX_API_KEY }}
        run: node scripts/prepare-daily-release.mjs
      - name: Expose normalized candidate version
        id: candidate-version
        if: steps.candidate.outputs.tag != ''
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
        run: echo "version=${TAG#opl-dsh-v}" >> "$GITHUB_OUTPUT"
      - name: Upload prepared release-notes draft
        if: steps.candidate.outputs.tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: dist/release-notes-draft-*.md
          if-no-files-found: error
          overwrite: true

  package:
    needs: prepare
    if: needs.prepare.outputs.tag != '' && needs.prepare.outputs.package_artifact == ''
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Require a frozen canonical tag and native arm64 packaging
        env:
          OPL_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const { version } = JSON.parse(readFileSync('package.json'))
          if (process.arch !== 'arm64') throw Error('Official macOS packaging requires arm64')
          if (process.env.OPL_RELEASE_TAG !== `opl-dsh-v${version}`) throw Error('Invalid canonical release tag')
          const tagged = execFileSync('git', ['rev-parse', `${process.env.OPL_RELEASE_TAG}^{commit}`], { encoding: 'utf8' }).trim()
          if (tagged !== execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()) throw Error('Release tag moved')
          if (execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' }).trim()) throw Error('Dirty source candidate')
          NODE
      - name: Install Windows installer compiler
        run: brew install nsis
      - run: npm ci --ignore-scripts
      - run: npm run generate:rpc
      - run: git diff --exit-code
      - run: npm run check:rpc
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run format:check
      - name: Load feed reader from this workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: dist/release-runner
      - name: Resolve the live official desktop feed version
        env:
          OPL_PREPARED_OFFICIAL_VERSION: ${{ needs.prepare.outputs.official_version }}
          OPL_PREPARED_OFFICIAL_WINDOWS_VERSION: ${{ needs.prepare.outputs.official_windows_version }}
          OPL_PREPARED_FEEDS_SHA256: ${{ needs.prepare.outputs.official_feeds_sha256 }}
        run: |
          node --input-type=module - <<'NODE'
          import { readOfficialDesktopFeeds } from './dist/release-runner/scripts/official-desktop-feeds.mjs'
          import { officialFeedFingerprint } from './dist/release-runner/scripts/release-recovery.mjs'
          const feeds = await readOfficialDesktopFeeds()
          const version = feeds['mac-arm64'].version
          const windowsVersion = feeds['win-x64'].version
          if (version !== process.env.OPL_PREPARED_OFFICIAL_VERSION ||
              windowsVersion !== process.env.OPL_PREPARED_OFFICIAL_WINDOWS_VERSION ||
              version !== windowsVersion ||
              officialFeedFingerprint(feeds) !== process.env.OPL_PREPARED_FEEDS_SHA256)
            throw Error('Official feeds changed after release preparation')
          await import('node:fs/promises').then(({ appendFile }) => appendFile(process.env.GITHUB_ENV, `OPL_OFFICIAL_VERSION=${version}\n`))
          console.log(`Using frozen official desktop feed version ${version} on macOS arm64 and Windows x64`)
          NODE
      - run: npm run package
      - run: npm test
      - name: Pair both live official feeds with the built candidate
        run: npm run release:manifest
      - name: Check the packaged manifest against the frozen feeds
        env:
          OPL_PREPARED_FEEDS_SHA256: ${{ needs.prepare.outputs.official_feeds_sha256 }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs'
          import { officialFeedFingerprint } from './dist/release-runner/scripts/release-recovery.mjs'
          const manifest = JSON.parse(readFileSync('dist/release-manifest.json', 'utf8'))
          if (officialFeedFingerprint(manifest.official.feeds) !== process.env.OPL_PREPARED_FEEDS_SHA256)
            throw Error('Packaged manifest differs from the frozen official feeds')
          NODE
      - uses: actions/upload-artifact@v7
        id: candidate
        with:
          name: release-candidate-${{ needs.prepare.outputs.package_key }}-${{ github.run_attempt }}
          compression-level: 0
          path: |
            dist/OPL-DSH-Enhancements.zip
            dist/OPL-DSH-Installer-mac-arm64.dmg
            dist/OPL-DSH-Installer-windows-x64.exe
            dist/release-manifest.json
          if-no-files-found: error

  qualify:
    needs: [prepare, package]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.tag != '' &&
      ((needs.package.result == 'success' && needs.package.outputs.artifact_id != '') ||
      (needs.package.result == 'skipped' && needs.prepare.outputs.package_artifact != '')) &&
      needs.prepare.outputs.pending_platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.pending_platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify Windows launcher and ACL regressions
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm run build:bridge
          node node_modules/vitest/vitest.mjs run tests/execution/harness-registry.spec.ts -t "probes a cmd shim"
          node --test tests/native-bridge.test.mjs tests/windows-acl.test.mjs
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.package_artifact || needs.package.outputs.artifact_id }}
          run-id: ${{ needs.prepare.outputs.package_run || github.run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Extract the exact shipped payload on macOS
        if: runner.os == 'macOS'
        run: unzip -q dist/OPL-DSH-Enhancements.zip -d 'dist/OPL DSH 一键安装'
      - name: Extract the exact shipped payload on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'dist/OPL DSH 一键安装') {
            Remove-Item -LiteralPath 'dist/OPL DSH 一键安装' -Recurse -Force
          }
          Expand-Archive -LiteralPath 'dist/OPL-DSH-Enhancements.zip' -DestinationPath 'dist/OPL DSH 一键安装'
      - name: Require clean qualification source
        shell: bash
        run: |
          git diff --exit-code
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process'
          const status = execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' }).trim()
          if (status) throw Error('Qualification source is dirty: ' + status)
          NODE
      - name: Check out the qualification runner from this workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: dist/qualification-runner
      - name: Qualify unmodified official Desktop against the shipped bytes
        id: qualification
        env:
          OPL_QUALIFICATION_RELEASE_MANIFEST: dist/release-manifest.json
        run: node dist/qualification-runner/scripts/qualify-official-runtime.mjs --download --payload "dist/OPL DSH 一键安装" --evidence dist/official-qualification.json
      - uses: actions/upload-artifact@v7
        if: ${{ always() && (steps.qualification.outcome == 'success' || steps.qualification.outcome == 'failure') }}
        with:
          name: ${{ steps.qualification.outcome == 'success'
            && format('release-qualification-{0}-{1}-{2}', matrix.os, needs.prepare.outputs.package_artifact || needs.package.outputs.artifact_id, needs.prepare.outputs.qualification_key)
            || format('release-qualification-diagnostics-{0}-{1}', matrix.os, github.run_attempt) }}
          overwrite: true
          path: |
            dist/official-qualification.json
            dist/official-qualification-client-*.png
          if-no-files-found: ${{ steps.qualification.outcome == 'success' && 'error' || 'warn' }}

  publish:
    needs: [prepare, package, qualify]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.tag != '' &&
      ((needs.package.result == 'success' && needs.package.outputs.artifact_id != '') ||
      (needs.package.result == 'skipped' && needs.prepare.outputs.package_artifact != '')) &&
      (needs.qualify.result == 'success' ||
      (needs.qualify.result == 'skipped' && needs.prepare.outputs.mac_artifact != '' &&
      needs.prepare.outputs.windows_artifact != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.package_artifact || needs.package.outputs.artifact_id }}
          run-id: ${{ needs.prepare.outputs.package_run || github.run_id }}
          github-token: ${{ github.token }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: dist
      - name: Download reused macOS qualification
        if: needs.prepare.outputs.mac_artifact != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.mac_artifact }}
          run-id: ${{ needs.prepare.outputs.mac_run }}
          github-token: ${{ github.token }}
          path: dist/evidence/macos-15
      - name: Download current macOS qualification
        if: needs.prepare.outputs.mac_artifact == ''
        uses: actions/download-artifact@v8
        with:
          name: release-qualification-macos-15-${{ needs.prepare.outputs.package_artifact || needs.package.outputs.artifact_id }}-${{ needs.prepare.outputs.qualification_key }}
          path: dist/evidence/macos-15
      - name: Download reused Windows qualification
        if: needs.prepare.outputs.windows_artifact != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.windows_artifact }}
          run-id: ${{ needs.prepare.outputs.windows_run }}
          github-token: ${{ github.token }}
          path: dist/evidence/windows-latest
      - name: Download current Windows qualification
        if: needs.prepare.outputs.windows_artifact == ''
        uses: actions/download-artifact@v8
        with:
          name: release-qualification-windows-latest-${{ needs.prepare.outputs.package_artifact || needs.package.outputs.artifact_id }}-${{ needs.prepare.outputs.qualification_key }}
          path: dist/evidence/windows-latest
      - name: Check out the publisher from this workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: dist/release-runner
          persist-credentials: false
      - name: Verify provenance, publish, and read back all public assets
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          OPL_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          OPL_PREPARED_OFFICIAL_VERSION: ${{ needs.prepare.outputs.official_version }}
          OPL_PREPARED_OFFICIAL_WINDOWS_VERSION: ${{ needs.prepare.outputs.official_windows_version }}
          OPL_PREPARED_FEEDS_SHA256: ${{ needs.prepare.outputs.official_feeds_sha256 }}
        run: node dist/release-runner/scripts/publish-stable-release.mjs
      - name: Retain publication and previous-release audit records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-audit-${{ github.run_attempt }}
          path: dist/release-audit/
          if-no-files-found: warn

  sync-cask:
    needs: publish
    if: >-
      !cancelled() &&
      (needs.publish.result == 'success' ||
      (github.ref == 'refs/heads/main' && inputs.cask_only && inputs.opl_release_control_run_id == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sync Cask from verified public Latest
        env:
          GH_TOKEN: ${{ github.token }}
          OPL_RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: node scripts/sync-release-cask.mjs

  emit-receipt:
    needs: [prepare, publish, sync-cask]
    if: >-
      always() && !cancelled() &&
      !(github.event_name == 'schedule' && vars.OPL_RELEASE_CENTRAL_DAILY == 'true') &&
      needs.prepare.result != 'skipped'
    permissions:
      actions: read
      contents: read
    uses: gaofeng21cn/opl-release/.github/workflows/reusable-emit-receipt.yml@v1
    with:
      subject_id: opl-dsh
      lane: stable
      stage: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.tag == '' && 'unchanged' || (needs.publish.result == 'success' && 'verified' || 'blocked') }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.publish.outputs.tag || needs.prepare.outputs.tag }}
      commit: ${{ needs.prepare.outputs.source_commit || github.sha }}
      published_version: ${{ needs.publish.result == 'success' && needs.prepare.outputs.version || '' }}
      published_tag: ${{ needs.publish.result == 'success' && needs.publish.outputs.tag || '' }}
      qualification_required: true
      qualification_status: ${{ needs.prepare.outputs.tag == '' && 'not_required' || (needs.publish.result == 'success' && 'passed' || 'failed') }}
      blocker_code: ${{ !(needs.prepare.result == 'success' && (needs.prepare.outputs.tag == '' || needs.publish.result == 'success')) && 'stable_release_failed' || '' }}
      blocker_message: ${{ !(needs.prepare.result == 'success' && (needs.prepare.outputs.tag == '' || needs.publish.result == 'success')) && 'opl-dsh stable-release did not complete publication' || '' }}
