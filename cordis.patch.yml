- insert:
    - id: opl-suite
      name: '@one-person-lab/dsh-opl'
      config:
        gateway:
          apiKeyEnv: OPL_GATEWAY_DEEPSEEK_API_KEY
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000
  disabled: !!js process.platform === 'win32'
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js false
- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  config:
    timeoutMs: 60000
  disabled: !!js true
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js true
- id: agent-default-model
  config:
    provider: opl-gateway
    model: deepseek-flash
- id: web
  config:
    searchProvider: opl-gateway
    fetchProvider: http
- id: llm-pi-ai
  config:
    providers:
      opl-gateway-openai:
        displayName: OPL Gateway · Codex
        api: openai-responses
        baseURL: https://gateway.medopl.com/v1
        apiKeyEnv: OPL_GATEWAY_CODEX_API_KEY
        models:
          - id: deepseek-flash
            name: DeepSeek-V4.1-Flash
            contextWindow: 1000000
            input: [text, image]
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: xhigh
          - id: gpt-6-astra
            name: GPT-6 Astra
          - id: gpt-6-sol
            name: GPT-6 Sol
          - id: gpt-6-luna
            name: GPT-6 Luna
      opl-gateway-aws:
        displayName: OPL Gateway · AWS
        api: anthropic-messages
        baseURL: https://gateway.medopl.com/v1
        apiKeyEnv: OPL_GATEWAY_AWS_API_KEY
        models:
          - id: claude-opus-5-5
            name: Claude Opus 5.5
      opl-gateway-kiro:
        displayName: OPL Gateway · Kiro
        api: anthropic-messages
        baseURL: https://gateway.medopl.com/v1
        apiKeyEnv: OPL_GATEWAY_KIRO_API_KEY
        models:
          - id: claude-opus-5-5
            name: Claude Opus 5.5
      opl-gateway-grok:
        displayName: OPL Gateway · Grok
        api: openai-responses
        baseURL: https://gateway.medopl.com/v1
        apiKeyEnv: OPL_GATEWAY_GROK_API_KEY
        models:
          - id: grok-4.7
            name: Grok 4.7
            contextWindow: 500000
- id: ui-settings-general
  config:
    welcomeNoticeVersion: '2026-08-13.1'
- id: ui-settings-account
  config:
    version: 1
    step: done
    completion: skipped
