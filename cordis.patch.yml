- insert:
    - id: opl-native-git-bash
      name: '@one-person-lab/dsh-opl/git-bash'
      disabled: true
    - id: opl-suite
      name: '@one-person-lab/dsh-opl'
      config:
        gateway:
          apiKeyEnv: OPL_GATEWAY_DEEPSEEK_API_KEY
- id: agent-default-model
  config:
    provider: opl-gateway
    model: deepseek-flash
    reasoningEffort: max
- id: web
  config:
    searchProvider: opl-gateway
    fetchProvider: http
- id: ui-settings-general
  config:
    welcomeNoticeVersion: '2026-08-13.1'
- id: ui-settings-account
  config:
    version: 1
    step: done
    completion: skipped
