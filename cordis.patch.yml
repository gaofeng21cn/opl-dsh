- insert:
    - id: opl-suite
      name: '@one-person-lab/dsh-opl'
- id: agent-default-model
  config:
    provider: opl-gateway
    model: deepseek-flash
- id: llm-pi-ai
  config:
    providers:
      opl-gateway-openai:
        displayName: OPL Gateway · OpenAI
        api: openai-responses
        baseURL: https://gateway.medopl.com/v1
        apiKeyEnv: OPL_GATEWAY_CODEX_API_KEY
        models:
          - id: deepseek-flash
            name: DeepSeek-V4.1-Flash
            contextWindow: 1000000
            input: [text, image]
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: xhigh
